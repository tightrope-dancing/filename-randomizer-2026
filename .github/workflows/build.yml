name: Build

# Every push and pull request: build the exe and the installer, upload both as run artifacts.
# Pushing a tag like v1.2.0: also publish a GitHub Release with the installer attached.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build (Release|x86)
        run: msbuild "Filename Randomizer.sln" /p:Configuration=Release /p:Platform=x86 /m /nologo /verbosity:minimal

      - name: Locate or install Inno Setup
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found after install" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer
        shell: pwsh
        run: '& $env:ISCC FilenameRandomizer.iss'

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: filename-randomizer-exe
          path: bin/Release/Filename Randomizer.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: filename-randomizer-setup
          path: Output/FilenameRandomizer_Setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches installer version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(grep -oP '^AppVersion=\K.*' FilenameRandomizer.iss | tr -d '\r')
          if [ "$tag" != "$app" ]; then
            echo "::error::Tag v$tag does not match AppVersion=$app in FilenameRandomizer.iss"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: filename-randomizer-setup

      - uses: softprops/action-gh-release@v2
        with:
          files: FilenameRandomizer_Setup.exe
          generate_release_notes: true
